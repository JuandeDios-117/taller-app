<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Corte Semanal - Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Corte Semanal de Pagos (Domingos)</h1>
        
        <div class="bg-gray-800 p-6 rounded-lg shadow">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-700 text-gray-400">
                        <th class="p-3">Empleado</th>
                        <th class="p-3">Facturas</th>
                        <th class="p-3">Total Vendido</th>
                        <th class="p-3">Ganancia Taller</th>
                        <th class="p-3 text-green-400">Pago a Realizar (30%)</th>
                        <th class="p-3">Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaCorte">
                    <!-- Se llena automáticamente con JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function cargarCorte() {
            const res = await fetch('/api/corte-semanal');
            const datos = await res.json();
            const tbody = document.getElementById('tablaCorte');
            tbody.innerHTML = '';

            datos.forEach(row => {
                const totalVendido = (row.total_vendido || 0).toLocaleString();
                const gananciaTaller = (row.ganancia_taller || 0).toLocaleString();
                const pagoEmpleado = (row.pago_empleado || 0).toLocaleString();

                tbody.innerHTML += `
                    <tr class="border-b border-gray-700">
                        <td class="p-3">${row.nombre}</td>
                        <td class="p-3">${row.total_facturas || 0}</td>
                        <td class="p-3">$${totalVendido}</td>
                        <td class="p-3">$${gananciaTaller}</td>
                        <td class="p-3 text-green-400 font-bold">$${pagoEmpleado}</td>
                        <td class="p-3">
                            <button onclick="pagarEmpleado(${row.usuario_id})" class="bg-green-600 hover:bg-green-700 px-3 py-1 rounded text-sm">
                                Liquidar Pago
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        async function pagarEmpleado(id) {
            if(!confirm("¿Confirmas que has pagado la comisión a este empleado?")) return;
            await fetch('/api/pagar-corte', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ usuario_id: id })
            });
            cargarCorte();
        }

        cargarCorte();
    </script>
</body>
</html>
